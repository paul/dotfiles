[tools]
# languages
ruby = "latest"
# crystal = "latest"
# php = "latest"
# pnpm = "latest"
# python = "3.11"
zig = "latest"
lua = "latest"
python = "latest"

# utilities
hub = "latest"
eza = "latest"
usage = "latest"
jj = "latest"
gh = "latest"
terraform = "latest"
rust = "latest"
bun = "latest"
aube = "latest"
opencode = "latest"
gum = "latest"
# Don't add it here, as soon as it upgrades itself it uses bun again anyway
# "github:anomalyco/opencode" = "latest"

[env]
RUBY_YJIT_ENABLE = "1"


[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false
